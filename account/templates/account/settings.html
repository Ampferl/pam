{% extends "dashboard.html" %}
{% block content %}
<div>
  <h2 class="fw-bold tracking-tight mb-4">Einstellungen</h2>
  <div class="row g-4">
    <div class="col-12 col-lg-8">
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Profil & Account</h5>
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">Vorname</label>
                <input type="text" class="form-control rounded-3" value="Admin">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">Nachname</label>
                <input type="text" class="form-control rounded-3" value="User">
              </div>
              <div class="col-12">
                <label class="form-label text-muted small fw-bold">E-Mail</label>
                <input type="email" class="form-control rounded-3" value="admin@lifeos.dev">
              </div>
              <div class="col-12 mt-4">
                <button type="button" class="btn btn-primary rounded-pill px-4">Änderungen speichern</button>
              </div>
            </div>
          </form>
        </div>
      </div>
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">Benachrichtigungen</h5>
          <div class="form-check form-switch fs-5 mb-3">
            <input class="form-check-input shadow-none" type="checkbox" id="notif1" checked>
            <label class="form-check-label fs-6 mt-1 ms-2" for="notif1">Tägliche Zusammenfassung per Email</label>
          </div>
          <div class="form-check form-switch fs-5 mb-3">
            <input class="form-check-input shadow-none" type="checkbox" id="notif2" checked>
            <label class="form-check-label fs-6 mt-1 ms-2" for="notif2">Push-Benachrichtigungen für Termine</label>
          </div>
          <div class="form-check form-switch fs-5">
            <input class="form-check-input shadow-none" type="checkbox" id="notif3">
            <label class="form-check-label fs-6 mt-1 ms-2" for="notif3">Wöchentlicher Report</label>
          </div>
        </div>
      </div>
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h5 class="fw-bold mb-4">PAM Management</h5>
          <ul>
            <li><a href="{% url 'core:management_overview' %}">Feature Toggles</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
