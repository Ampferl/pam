{% if node.type == 'folder' %}
<!-- FOLDER -->
<div class="tree-node" data-id="{{ node.id }}" data-type="folder">
  <div class="list-group-item list-group-item-action bg-transparent border-0 d-flex justify-content-between align-items-center py-2">
    <a class="text-decoration-none text-body fw-semibold d-flex align-items-center gap-2 flex-grow-1
      {% if level == 2 %}ps-4{% elif level == 3 %}ps-5{% elif level == 4 %}ps-5 ms-3{% elif level >= 5 %}ps-5 ms-4{% endif %}" 
      data-bs-toggle="collapse" href="#folder-{{ node.id }}" aria-expanded="{% if node.is_open %}true{% else %}false{% endif %}">
      <i class="bi bi-folder text-muted"></i> 
      <span class="node-name" contenteditable="false">{{ node.name }}</span>
    </a>

    <!-- Actions (Create + Delete) -->
    <div class="d-flex gap-2 px-1 align-items-center">
      <button type="button" class="btn btn-link p-0 text-muted text-decoration-none create-child-btn" data-id="{{ node.id }}" data-type="file" title="Neue Notiz hier">
        <i class="bi bi-file-earmark-plus"></i>
      </button>
      <button type="button" class="btn btn-link p-0 text-muted text-decoration-none create-child-btn" data-id="{{ node.id }}" data-type="folder" title="Neuer Unterordner hier">
        <i class="bi bi-folder-plus"></i>
      </button>
      <!-- NEW: Delete Directory Button -->
      <button type="button" class="btn btn-link p-0 text-danger text-decoration-none delete-item-btn" data-id="{{ node.id }}" data-name="{{ node.name }}" title="Ordner löschen">
        <i class="bi bi-trash"></i>
      </button>
    </div>
  </div>

  <!-- FOLDER CONTENT -->
  <div class="collapse {% if node.is_open %}show{% endif %}" id="folder-{{ node.id }}">
    <div class="list-group list-group-flush">
      {% for child in node.children %}
        {% include "partials/tree_node.html" with node=child level=level|add:1 %}
      {% endfor %}
    </div>
  </div>
</div>

{% elif node.type == 'file' %}
<!-- FILE -->
<div class="tree-node" data-id="{{ node.id }}" data-type="file">
  <a href="{% url 'knowledge:note_detail' node.id %}" class="list-group-item list-group-item-action border-0 py-2 d-flex align-items-center gap-2
    {% if node.is_active %}bg-body border-start border-primary border-4 active-note{% else %}bg-transparent text-body{% endif %}">
    
    <div class="d-flex align-items-center gap-2
      {% if level == 2 and not node.is_active %}ps-4
      {% elif level == 2 and node.is_active %}ps-3 ms-1
      {% elif level == 3 and not node.is_active %}ps-5
      {% elif level == 3 and node.is_active %}ps-4 ms-2
      {% elif level == 4 and not node.is_active %}ps-5 ms-3
      {% elif level == 4 and node.is_active %}ps-5 ms-2
      {% elif level >= 5 and not node.is_active %}ps-5 ms-4
      {% elif level >= 5 and node.is_active %}ps-5 ms-3{% endif %}">
      
      <i class="bi bi-file-earmark-text {% if node.is_active %}text-primary{% else %}text-muted{% endif %}"></i> 
      <span class="node-name {% if node.is_active %}fw-bold{% endif %}" contenteditable="false">{{ node.name }}</span>
    </div>
  </a>
</div>
{% endif %}
