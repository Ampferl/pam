{% extends "dashboard.html" %}
{% block content %}
<div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold tracking-tight mb-0">Rezepte & Ernährung</h2>
    <div class="input-group input-group-sm w-auto">
      <input type="text" class="form-control rounded-start-pill" placeholder="Zutat suchen...">
      <button class="btn btn-primary rounded-end-pill"><i class="bi bi-search"></i></button>
    </div>
  </div>

  <!-- Filter Tags -->
  <div class="d-flex gap-2 mb-4 overflow-auto pb-2" style="scrollbar-width: none;">
    <span class="badge bg-primary rounded-pill px-3 py-2 fs-6 cursor-pointer">Alle</span>
    <span class="badge bg-body-tertiary text-body border rounded-pill px-3 py-2 fs-6 cursor-pointer">High Protein</span>
    <span class="badge bg-body-tertiary text-body border rounded-pill px-3 py-2 fs-6 cursor-pointer">Low Carb</span>
    <span class="badge bg-body-tertiary text-body border rounded-pill px-3 py-2 fs-6 cursor-pointer">Vegan</span>
    <span class="badge bg-body-tertiary text-body border rounded-pill px-3 py-2 fs-6 cursor-pointer">Meal Prep <15m</span>
  </div>

  <div class="row g-4">
    <!-- Recipe 1 -->
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="card h-100 border-0 shadow-sm card-hover cursor-pointer p-0">
        <img src="https://placehold.co/400x300/10b981/ffffff?text=Bowl" class="recipe-img w-100" alt="Food">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between mb-2">
            <span class="badge bg-success-subtle text-success">Vegan</span>
            <small class="text-muted"><i class="bi bi-clock"></i> 20m</small>
          </div>
          <h6 class="fw-bold mb-1">Quinoa Tofu Bowl</h6>
          <p class="text-muted small mb-0">550 kcal · 35g Protein</p>
        </div>
      </div>
    </div>
    <!-- Recipe 2 -->
    <div class="col-12 col-sm-6 col-xl-3">
      <div class="card h-100 border-0 shadow-sm card-hover cursor-pointer p-0">
        <img src="https://placehold.co/400x300/f59e0b/ffffff?text=Curry" class="recipe-img w-100" alt="Food">
        <div class="card-body p-3">
          <div class="d-flex justify-content-between mb-2">
            <span class="badge bg-warning-subtle text-warning">Meal Prep</span>
            <small class="text-muted"><i class="bi bi-clock"></i> 40m</small>
          </div>
          <h6 class="fw-bold mb-1">Hähnchen Curry</h6>
          <p class="text-muted small mb-0">620 kcal · 45g Protein</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
